site_name: 阿卡迪亚蝶梦 Arcadian Butterfly Dream 开发配套资料
site_description: 阿卡迪亚蝶梦 — 基于 Godot 4.7 的中文文字冒险游戏
site_author: furau
site_url: https://butterfly.seer2.org/
repo_url: https://github.com/E72UJ/Butterfly
repo_name: E72UJ/Butterfly

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # 不加载 Google Fonts：该域名在国内不可达且阻塞首屏渲染，改用系统字体
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - blog:
      blog_dir: devlog
      blog_toc: true
      post_dir: "{blog}/posts"
      post_url_format: "{date}/{slug}"
      post_date_format: "yyyy 年 M 月 d 日"
      post_readtime: false
      archive: true
      archive_name: 归档
      archive_url_format: "archive/{date}"
      archive_date_format: "yyyy 年"
      categories: true
      categories_name: 分类
      authors: false

nav:
  - 首页: index.md
  - 初始化项目: setup.md
  - 黄皮书调用: yellowbook.md
  - 开发指南:
      - 项目结构: guide/structure.md
      - 房间过场桥接: guide/room-bridge.md
      - 全局回退系统: guide/rollback.md
  - 开发日志: devlog/index.md
  - 关于: about.md
